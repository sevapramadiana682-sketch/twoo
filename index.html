<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#020617;color:#e2e8f0}.glass{background:rgba(15,23,42,.84);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.2)}.card{background:rgba(15,23,42,.75);border:1px solid rgba(100,116,139,.3)}.section{display:none}.section.active{display:block}.page{min-height:calc(100vh - 64px)}button,input,select,textarea{font:inherit}.navbtn{padding:.6rem 1rem;border-radius:.75rem;background:#1e293b;border:1px solid #334155;font-size:.8rem;font-weight:700}.navbtn:hover{background:#2563eb}.sim{position:relative;min-height:650px;overflow:hidden;border-radius:1.5rem;background:radial-gradient(circle at 50% 25%,#172554,#020617 70%)}.panel{background:rgba(2,6,23,.76);border:1px solid rgba(148,163,184,.2);backdrop-filter:blur(10px)}.hidden{display:none!important}.btn{border-radius:.8rem;padding:.65rem 1rem;font-weight:800;font-size:.78rem}.meter{position:relative;width:42px;height:245px;border:4px solid #cbd5e1;border-radius:24px;background:linear-gradient(to right,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 12px rgba(255,255,255,.08)}.meter .tube{position:absolute;left:9px;right:9px;bottom:20px;height:195px;border-radius:16px;background:rgba(255,255,255,.08);overflow:hidden}.meter .fill{position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(to top,#38bdf8,#facc15,#ef4444);transition:height .25s}.meter .bulb{position:absolute;width:62px;height:62px;border-radius:50%;bottom:-36px;left:50%;transform:translateX(-50%);background:#ef4444;box-shadow:0 0 25px rgba(239,68,68,.5)}.beaker{position:relative;border:3px solid rgba(226,232,240,.65);border-top:0;border-radius:0 0 28px 28px;overflow:hidden;background:rgba(255,255,255,.04)}.liquid{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(56,189,248,.55),rgba(30,64,175,.65));transition:height .3s}.wave{position:absolute;left:-10%;width:120%;height:22px;top:-11px;border-radius:50%;background:rgba(125,211,252,.5);animation:wave 2.5s ease-in-out infinite}.bubble{position:absolute;border-radius:50%;background:rgba(224,242,254,.75);animation:bubble 2.8s linear infinite}.particle{position:absolute;width:7px;height:7px;border-radius:50%;background:#f8fafc;opacity:.85}.heat-particle{animation:moveParticle linear infinite}.flame{position:relative;width:75px;height:110px;filter:drop-shadow(0 0 18px #f97316)}.flame:before,.flame:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%) rotate(45deg);border-radius:55% 45% 55% 45%;background:linear-gradient(135deg,#fde047,#f97316 55%,#dc2626);animation:flicker .45s infinite alternate}.flame:before{width:68px;height:92px}.flame:after{width:34px;height:55px;background:linear-gradient(135deg,#fff7ed,#fde047 50%,#f97316);bottom:8px}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fde68a;animation:spark 1.2s infinite ease-out}.rod{height:62px;border-radius:14px;background:linear-gradient(90deg,#334155,#94a3b8,#64748b);position:relative;overflow:hidden;border:2px solid #cbd5e1}.rod-seg{position:absolute;top:0;bottom:0;border-right:1px solid rgba(255,255,255,.2)}.temp-dot{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px currentColor}.convection-fluid{position:relative;height:330px;width:390px;max-width:90vw;border:4px solid #94a3b8;border-top:0;border-radius:0 0 30px 30px;overflow:hidden;background:rgba(14,165,233,.08)}.conv-p{position:absolute;width:12px;height:12px;border-radius:50%;background:#fbbf24;box-shadow:0 0 9px #f59e0b}.sun{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#fde047 20%,#f97316 55%,#ef4444 78%,transparent 80%);box-shadow:0 0 55px #f97316}.ray{height:4px;border-radius:4px;background:linear-gradient(90deg,#fde047,rgba(251,191,36,0));transform-origin:left center;animation:ray 1.2s infinite alternate}.target{position:relative;width:110px;height:150px;border-radius:14px 14px 25px 25px;background:linear-gradient(90deg,#475569,#94a3b8,#475569);border:2px solid #cbd5e1}.sensor{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 16px #38bdf8}.graph{width:100%;height:240px;background:#020617;border:1px solid #334155;border-radius:14px}.data-table{min-width:760px}.status{min-height:22px}.timerbox{min-width:190px}.scale-card{position:relative}.scale-points{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.68rem;color:#94a3b8}.scale-points span{padding:.2rem .4rem;border-radius:.5rem;background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.18)}.thermo-mark{position:absolute;right:-92px;font-size:.62rem;color:#cbd5e1;white-space:nowrap}.thermo-mark.top{top:4px}.thermo-mark.bottom{bottom:14px}.timerbar{height:6px;border-radius:999px;background:#1e293b;overflow:hidden}.timerfill{height:100%;width:0%;background:#22c55e;transition:width .2s}.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .55rem;border-radius:999px;font-size:.7rem;font-weight:800;background:#1e293b;color:#cbd5e1}@keyframes wave{50%{transform:translateX(35px)}100%{transform:translateX(-20px)}}@keyframes bubble{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-300px);opacity:0}}@keyframes flicker{to{transform:translateX(-50%) rotate(40deg) scale(1.05)}}@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(18px,-75px);opacity:0}}@keyframes ray{to{opacity:.35;transform:scaleX(.72)}}@media(max-width:700px){.sim{min-height:760px}.meter{height:190px}.meter .tube{height:145px}.convection-fluid{height:260px}.data-table{min-width:680px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="sticky top-0 z-50 glass h-16"><div class="max-w-7xl mx-auto h-full px-4 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-blue-600 flex items-center justify-center"><i class="fa-solid fa-temperature-half"></i></div><div><h1 class="font-black text-sm md:text-lg">Suhu dan Kalor</h1><p class="text-[10px] md:text-xs text-slate-400">Virtual Laboratory • 3 Pertemuan</p></div></div><button id="btnHome" class="btn bg-slate-800"><i class="fa-solid fa-house mr-1"></i>Beranda</button></div></header>
<main>
<section id="home" class="section active page p-5 md:p-10"><div class="max-w-7xl mx-auto"><div class="rounded-3xl p-7 md:p-10 bg-gradient-to-br from-blue-950 via-slate-900 to-amber-950 border border-slate-700 shadow-2xl mb-8"><span class="text-xs uppercase tracking-[.2em] text-blue-300 font-bold">Media Pembelajaran Interaktif</span><h2 class="text-3xl md:text-5xl font-black mt-2">Suhu dan Kalor</h2><p class="text-slate-300 mt-3 max-w-3xl leading-relaxed">Eksperimen virtual untuk mengamati, mengukur, mengumpulkan data, membuat grafik, dan menarik kesimpulan pada materi suhu, kalor, serta perpindahan kalor.</p></div><div class="grid md:grid-cols-3 gap-5"><button id="btnMeeting1" class="card rounded-3xl p-6 text-left hover:border-blue-400 hover:-translate-y-1 transition"><div class="w-14 h-14 rounded-2xl bg-blue-500/20 text-blue-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-temperature-half"></i></div><span class="text-xs font-bold text-blue-300">PERTEMUAN 1</span><h3 class="text-2xl font-black mt-1">Suhu & Skala Termometer</h3><p class="text-sm text-slate-400 mt-2">Eksplorasi Celsius, Réaumur, Fahrenheit, dan Kelvin serta perbandingan matematisnya.</p><span class="mt-5 block w-full py-3 rounded-xl bg-blue-600 text-center font-bold">Masuk Virtual Lab</span></button><button id="btnMeeting2" class="card rounded-3xl p-6 text-left hover:border-amber-400 hover:-translate-y-1 transition"><div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-fire"></i></div><span class="text-xs font-bold text-amber-300">PERTEMUAN 2</span><h3 class="text-2xl font-black mt-1">Kalor</h3><p class="text-sm text-slate-400 mt-2">Pemanasan bahan secara virtual dengan partikel bergerak, api dinamis, termometer, dan pengambilan data.</p><span class="mt-5 block w-full py-3 rounded-xl bg-amber-600 text-center font-bold">Masuk Virtual Lab</span></button><button id="btnMeeting3" class="card rounded-3xl p-6 text-left hover:border-rose-400 hover:-translate-y-1 transition"><div class="w-14 h-14 rounded-2xl bg-rose-500/20 text-rose-300 flex items-center justify-center text-2xl mb-5"><i class="fa-solid fa-arrows-left-right-to-line"></i></div><span class="text-xs font-bold text-rose-300">PERTEMUAN 3</span><h3 class="text-2xl font-black mt-1">Perpindahan Kalor</h3><p class="text-sm text-slate-400 mt-2">Eksperimen konduksi, konveksi, dan radiasi dengan sensor suhu serta data untuk dianalisis.</p><span class="mt-5 block w-full py-3 rounded-xl bg-rose-600 text-center font-bold">Masuk Virtual Lab</span></button></div></div></section>

<section id="meeting1" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m1('materi')" class="navbtn">Materi</button><button onclick="m1('sim')" class="navbtn">Virtual Lab Suhu</button><button onclick="m1('lkpd')" class="navbtn">LKPD</button><button onclick="m1('eval')" class="navbtn">Evaluasi</button></div><div id="m1-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m1-sim" class="mcontent hidden"></div><div id="m1-lkpd" class="mcontent hidden"></div><div id="m1-eval" class="mcontent hidden"></div></div></section>
<section id="meeting2" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m2('materi')" class="navbtn">Materi</button><button onclick="m2('sim')" class="navbtn">Virtual Lab Kalor</button><button onclick="m2('data')" class="navbtn">Data Eksperimen</button><button onclick="m2('lkpd')" class="navbtn">LKPD</button><button onclick="m2('eval')" class="navbtn">Evaluasi</button></div><div id="m2-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m2-sim" class="mcontent hidden"></div><div id="m2-data" class="mcontent hidden"></div><div id="m2-lkpd" class="mcontent hidden"></div><div id="m2-eval" class="mcontent hidden"></div></div></section>
<section id="meeting3" class="section page"><div class="max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-4"><button onclick="m3('materi')" class="navbtn">Materi</button><button onclick="m3('sim')" class="navbtn">Virtual Lab Perpindahan</button><button onclick="m3('data')" class="navbtn">Data Eksperimen</button><button onclick="m3('lkpd')" class="navbtn">LKPD</button><button onclick="m3('eval')" class="navbtn">Evaluasi</button></div><div id="m3-materi" class="mcontent card rounded-3xl p-6 md:p-8"></div><div id="m3-sim" class="mcontent hidden"></div><div id="m3-data" class="mcontent hidden"></div><div id="m3-lkpd" class="mcontent hidden"></div><div id="m3-eval" class="mcontent hidden"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo({top:0,behavior:'smooth'});renderMath()};function goHome(){show('home')}function openMeeting(n){show('meeting'+n);window['m'+n]('materi')};function renderMath(){if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};function tabs(prefix,key){document.querySelectorAll('[id^="'+prefix+'-"]').forEach(x=>x.classList.toggle('hidden',x.id!==prefix+'-'+key));renderMath()}
// PERTEMUAN 1
function m1(k){tabs('m1',k);if(k==='sim')renderTempLab()}
$('m1-materi').innerHTML=`<div class="flex items-center gap-4 mb-7"><div class="w-14 h-14 rounded-2xl bg-blue-500/20 text-blue-300 flex items-center justify-center text-2xl"><i class="fa-solid fa-temperature-half"></i></div><div><span class="text-xs font-bold text-blue-300">PERTEMUAN 1</span><h2 class="text-3xl font-black">Suhu dan Skala Termometer</h2></div></div><div class="grid md:grid-cols-2 gap-5"><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Konsep Suhu</h3><p class="text-sm text-slate-300 mt-2">Suhu menyatakan derajat panas atau dingin suatu benda dan dapat diukur menggunakan termometer. Satu keadaan suhu dapat dinyatakan dengan beberapa skala.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Empat Skala</h3><p class="text-sm text-slate-300 mt-2">Virtual lab menyediakan Celsius, Réaumur, Fahrenheit, dan Kelvin. Peserta didik diminta membandingkan pembacaan keempat termometer berdasarkan data hasil pengamatan.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Pendekatan Penemuan</h3><p class="text-sm text-slate-300 mt-2">Tidak ada hubungan matematis yang diberikan di awal. Peserta didik mengumpulkan beberapa pasangan data, membandingkan perubahan nilainya, menemukan pola, lalu menyusun sendiri persamaan hubungan antarskala.</p></article><article class="card p-5 rounded-2xl"><h3 class="font-bold text-lg">Tujuan</h3><ul class="list-disc ml-5 text-sm text-slate-300 space-y-1"><li>Membaca empat skala suhu pada keadaan yang sama.</li><li>Menganalisis perubahan nilai antarskala dari data pengamatan.</li><li>Menemukan pola hubungan dan menyusun persamaan perbandingan berdasarkan bukti.</li><li>Menyajikan hasil analisis dalam tabel dan grafik.</li></ul></article></div>`;
let tempRecords=[];let tempTimer={duration:60,elapsed:0,run:false,last:0};
function renderTempLab(){ $('m1-sim').innerHTML=`<div class="sim"><div class="absolute top-4 left-4 right-4 z-10 flex flex-wrap justify-between gap-3"><div class="panel rounded-2xl p-4"><span class="text-xs text-blue-300 font-bold">VIRTUAL LAB • EMPAT TERMOMETER</span><div class="text-3xl font-black"><span id="tC">25.0</span> °C</div><div class="text-xs text-slate-400 mt-1">Amati dan bandingkan pembacaan. Hubungan matematis tidak ditampilkan.</div></div><div class="panel rounded-2xl p-3 timerbox"><div class="flex items-center justify-between gap-3"><span class="text-xs font-bold text-emerald-300">WAKTU PENGAMATAN</span><span id="tTimerText" class="font-black">01:00</span></div><div class="timerbar mt-2"><div id="tTimerFill" class="timerfill"></div></div><button onclick="startTempTimer()" class="btn bg-emerald-600 mt-2 w-full">Mulai Timer Otomatis</button></div><button onclick="resetTempLab()" class="btn panel">↻ Reset</button></div><div class="absolute inset-x-4 top-32 bottom-48 flex items-center justify-center"><div class="grid grid-cols-2 md:grid-cols-4 gap-10 md:gap-16 items-end"><div class="text-center scale-card"><div class="meter mx-auto"><div class="tube"><div id="fillC" class="fill"></div></div><div class="bulb"></div><span class="thermo-mark top">Didih: 100 °C</span><span class="thermo-mark bottom">Beku: 0 °C</span></div><b class="block mt-10">Celsius</b><span id="vC" class="text-xl font-black">25.0 °C</span><div class="scale-points"><span>0 °C</span><span>100 °C</span></div></div><div class="text-center scale-card"><div class="meter mx-auto"><div class="tube"><div id="fillR" class="fill"></div></div><div class="bulb"></div><span class="thermo-mark top">Didih: 80 °R</span><span class="thermo-mark bottom">Beku: 0 °R</span></div><b class="block mt-10">Réaumur</b><span id="vR" class="text-xl font-black">20.0 °R</span><div class="scale-points"><span>0 °R</span><span>80 °R</span></div></div><div class="text-center scale-card"><div class="meter mx-auto"><div class="tube"><div id="fillF" class="fill"></div></div><div class="bulb"></div><span class="thermo-mark top">Didih: 212 °F</span><span class="thermo-mark bottom">Beku: 32 °F</span></div><b class="block mt-10">Fahrenheit</b><span id="vF" class="text-xl font-black">77.0 °F</span><div class="scale-points"><span>32 °F</span><span>212 °F</span></div></div><div class="text-center scale-card"><div class="meter mx-auto"><div class="tube"><div id="fillK" class="fill"></div></div><div class="bulb"></div><span class="thermo-mark top">Didih: 373.15 K</span><span class="thermo-mark bottom">Beku: 273.15 K</span></div><b class="block mt-10">Kelvin</b><span id="vK" class="text-xl font-black">298.15 K</span><div class="scale-points"><span>273.15 K</span><span>373.15 K</span></div></div></div></div><div class="absolute bottom-4 left-4 right-4 panel rounded-3xl p-4 grid md:grid-cols-6 gap-3 items-end"><label class="text-xs font-bold md:col-span-2">Atur suhu Celsius: <span id="tSliderVal">25.0</span> °C<input id="tSlider" type="range" min="0" max="100" step="1" value="25" class="w-full mt-2" oninput="updateTempLab(this.value)"></label><label class="text-xs font-bold">Sampel<input id="tSample" type="number" min="1" max="20" value="1" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2"></label><label class="text-xs font-bold">Durasi<input id="tDur" type="number" min="1" max="3600" value="60" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2" onchange="setTempDuration()"></label><label class="text-xs font-bold">Satuan<select id="tUnit" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl p-2" onchange="setTempDuration()"><option value="s">detik</option><option value="m">menit</option></select></label><button onclick="recordTemp()" class="btn bg-blue-600">+ Catat Data</button><button onclick="clearTempData()" class="btn bg-slate-700">Hapus Data</button></div></div><div class="mt-4 card rounded-2xl p-4"><div class="flex flex-wrap justify-between gap-3"><div><b>Eksperimen:</b> pilih beberapa suhu, baca keempat termometer, lalu catat data. Gunakan titik beku dan titik didih sebagai acuan untuk membandingkan rentang tiap skala.</div><span class="badge"><i class="fa-solid fa-database"></i> <span id="tempCount">0</span> data</span></div><div class="overflow-auto mt-3"><table class="w-full text-xs data-table"><thead class="bg-slate-800"><tr><th class="p-2">No</th><th class="p-2">°C</th><th class="p-2">°R</th><th class="p-2">°F</th><th class="p-2">K</th></tr></thead><tbody id="tempRows"><tr><td colspan="5" class="p-5 text-center text-slate-500">Belum ada data.</td></tr></tbody></table></div></div>`;updateTempLab(25);setTempDuration();renderTempRows()}
function updateTempLab(c){c=Math.max(0,Math.min(100,+c||0));let r=c*4/5,f=c*9/5+32,k=c+273.15;$('tC').textContent=c.toFixed(1);$('tSliderVal').textContent=c.toFixed(1);$('vC').textContent=c.toFixed(1)+' °C';$('vR').textContent=r.toFixed(1)+' °R';$('vF').textContent=f.toFixed(1)+' °F';$('vK').textContent=k.toFixed(2)+' K';[['fillC',c],['fillR',r/80*100],['fillF',(f-32)/180*100],['fillK',c]].forEach(([id,h])=>$(id).style.height=Math.max(3,Math.min(100,h))+'%')}
function setTempDuration(){let n=Math.max(1,+$('tDur')?.value||60),u=$('tUnit')?.value||'s';tempTimer.duration=u==='m'?n*60:n;tempTimer.elapsed=0;tempTimer.run=false;tempTimer.last=performance.now();updateTempTimer()}
function updateTempTimer(){let left=Math.max(0,tempTimer.duration-tempTimer.elapsed),mins=Math.floor(left/60),secs=Math.floor(left%60);if($('tTimerText'))$('tTimerText').textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');if($('tTimerFill'))$('tTimerFill').style.width=Math.min(100,tempTimer.elapsed/tempTimer.duration*100)+'%'}
function startTempTimer(){setTempDuration();tempTimer.run=true;tempTimer.last=performance.now();if($('tTimerText'))$('tTimerText').textContent='MULAI...'}
function tempTimerLoop(now){if(tempTimer.run){let dt=Math.min(.25,(now-tempTimer.last)/1000);tempTimer.last=now;tempTimer.elapsed+=dt;if(tempTimer.elapsed>=tempTimer.duration){tempTimer.elapsed=tempTimer.duration;tempTimer.run=false;if($('tTimerText'))$('tTimerText').textContent='SELESAI';}updateTempTimer()}requestAnimationFrame(tempTimerLoop)}requestAnimationFrame(tempTimerLoop)
function recordTemp(){let c=+$('tSlider').value,r=c*4/5,f=c*9/5+32,k=c+273.15;tempRecords.push({sample:$('tSample').value,c,r,f,k});renderTempRows()};function renderTempRows(){let b=$('tempRows');if(!b)return;$('tempCount').textContent=tempRecords.length;b.innerHTML=tempRecords.length?tempRecords.map((x,i)=>`<tr class="border-t border-slate-700"><td class="p-2">${i+1}</td><td class="p-2">${x.c.toFixed(1)}</td><td class="p-2">${x.r.toFixed(1)}</td><td class="p-2">${x.f.toFixed(1)}</td><td class="p-2">${x.k.toFixed(2)}</td></tr>`).join(''):`<tr><td colspan="5" class="p-5 text-center text-slate-500">Belum ada data.</td></tr>`};function clearTempData(){tempRecords=[];renderTempRows()};function resetTempLab(){tempTimer.run=false;if($('tSlider')){$('tSlider').value=25;updateTempLab(25)}if($('tDur'))$('tDur').value=60;if($('tUnit'))$('tUnit').value='s';setTempDuration()}

function seedConvParticles(){let p=$('convParticles');if(!p)return;p.innerHTML='';for(let i=0;i<28;i++){let s=document.createElement('span');s.className='conv-p';s.style.left=(8+Math.random()*84)+'%';s.style.bottom=(5+Math.random()*80)+'%';s.style.animation=`convMove ${2.5+Math.random()*2}s ${-Math.random()*3}s infinite ease-in-out`;p.appendChild(s)}let st=document.createElement('style');st.id='convStyle';st.textContent='@keyframes convMove{0%{transform:translate(0,0)}25%{transform:translate(25px,-80px)}50%{transform:translate(-15px,-160px)}75%{transform:translate(-30px,-70px)}100%{transform:translate(0,0)}}';document.head.appendChild(st)}
function renderTransferText(){let t=$('transferText');if(!t)return;if(transState.mode==='konduksi')t.innerHTML='<b class="text-white">Konduksi:</b> ubah daya pemanas dan posisi sensor. Amati bahwa bagian batang yang lebih dekat sumber panas mengalami kenaikan suhu lebih cepat.';else if(transState.mode==='konveksi')t.innerHTML='<b class="text-white">Konveksi:</b> amati lintasan partikel. Gerakan fluida membawa energi dari bagian yang dipanaskan ke bagian lain.';else t.innerHTML='<b class="text-white">Radiasi:</b> ubah jarak sensor. Bandingkan suhu sensor untuk jarak yang berbeda.'}
function updateTransfer(){let a=+$('trA').value,b=+$('trB').value;transState.power=a;transState.distance=b;if(transState.mode==='konduksi'){$('trAVal').textContent=a+'% daya pemanas';$('trBVal').textContent=b+'% posisi sensor';$('sensorDot')?.style.setProperty('left',b+'%')}else if(transState.mode==='konveksi'){$('trAVal').textContent=a+'% intensitas pemanas';$('trBVal').textContent=b+'% kecepatan aliran';}else{$('trAVal').textContent=a+'% intensitas sumber';$('trBVal').textContent=b+' cm jarak sensor'}renderTransferText()};function getTransferDuration(){let n=Math.max(1,+$('trDur')?.value||60),u=$('trUnit')?.value||'s';return u==='m'?n*60:n};function toggleTransfer(){if(transState.run)return;transState.duration=getTransferDuration();transState.time=0;transState.sensor=20;transState.run=true;transState.last=performance.now();$('trStart').textContent='Eksperimen Berjalan...'}function resetTransfer(){transferMode(transState.mode);if($('trDur'))$('trDur').value=60;if($('trUnit'))$('trUnit').value='s'}function transferLoop(now){let dt=Math.min(.25,(now-(transState.last||now))/1000);transState.last=now;if(transState.run){let remaining=transState.duration-transState.time;dt=Math.min(dt,Math.max(0,remaining));if(transState.mode==='konduksi')transState.sensor=Math.min(100,20+(transState.power*.7)*(transState.time/15)*(1-transState.distance/140));else if(transState.mode==='konveksi')transState.sensor=Math.min(100,25+transState.power*.5*(1-Math.exp(-transState.time/12)));else transState.sensor=Math.min(100,25+transState.power*.8/(1+transState.distance/20)*(1-Math.exp(-transState.time/10)));transState.time+=dt;if($('trTemp'))$('trTemp').textContent=transState.sensor.toFixed(1)+' °C';if(transState.time>=transState.duration){transState.time=transState.duration;transState.run=false;if($('trStart'))$('trStart').textContent='Selesai — Jalankan Lagi'}}requestAnimationFrame(transferLoop)}requestAnimationFrame(transferLoop);
function recordTransfer(){transferLogs.push({mode:transState.mode,a:transState.power,b:transState.distance,time:transState.time,temp:transState.sensor});renderTransferData()};function renderTransferData(){if(!$('transferDataMount'))return;$('transferDataMount').innerHTML=`<div class="card rounded-3xl p-5 overflow-auto"><div class="flex justify-between items-center mb-4"><div><span class="text-xs text-rose-300 font-bold">DATA EKSPERIMEN</span><h2 class="text-xl font-black">Hasil Pengamatan Perpindahan Kalor</h2></div><button onclick="transferLogs=[];renderTransferData()" class="btn bg-rose-600">Hapus Data</button></div><table class="w-full text-xs data-table"><thead><tr class="bg-slate-800"><th class="p-3">No</th><th class="p-3">Mode</th><th class="p-3">Variabel 1</th><th class="p-3">Variabel 2</th><th class="p-3">Waktu (s)</th><th class="p-3">Suhu sensor (°C)</th></tr></thead><tbody>${transferLogs.length?transferLogs.map((x,i)=>`<tr class="border-t border-slate-700"><td class="p-3">${i+1}</td><td class="p-3">${x.mode}</td><td class="p-3">${x.a.toFixed(0)}</td><td class="p-3">${x.b.toFixed(0)}</td><td class="p-3">${x.time.toFixed(1)}</td><td class="p-3">${x.temp.toFixed(1)}</td></tr>`).join(''):`<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada data. Jalankan eksperimen lalu klik Catat Data.</td></tr>`}</tbody></table><div class="mt-5 p-4 rounded-2xl bg-slate-800/60 text-sm"><b>Analisis:</b> gunakan data untuk membandingkan pengaruh daya/intensitas, jarak, atau waktu terhadap suhu sensor. Buat grafik sesuai variabel yang diuji pada LKPD.</div></div>`}
$('m3-lkpd').innerHTML=`<div class="card rounded-3xl p-6"><span class="text-xs text-rose-300 font-bold">LKPD PERTEMUAN 3</span><h2 class="text-2xl font-black mb-6">Eksperimen dan Analisis Perpindahan Kalor</h2><div class="space-y-5 text-sm"><p><b>1. Konduksi.</b> Ubah posisi sensor pada batang. Gunakan minimal 4 posisi. Jalankan simulasi selama waktu yang sama dan catat suhu sensor.</p><p><b>2. Konveksi.</b> Amati gerakan partikel fluida. Ubah intensitas pemanas dan amati perubahan pola gerak serta suhu sensor.</p><p><b>3. Radiasi.</b> Ubah jarak sensor minimal 4 kali. Catat suhu sensor setelah waktu pengamatan yang sama.</p><table class="w-full text-xs border border-slate-700"><tr class="bg-slate-800"><th class="p-3">Jenis</th><th class="p-3">Variabel bebas</th><th class="p-3">Variabel terikat</th><th class="p-3">Pola data</th></tr>${['Konduksi','Konveksi','Radiasi'].map(x=>`<tr><td class="p-3 border-t border-slate-700 font-bold">${x}</td><td class="p-3 border-t border-slate-700"></td><td class="p-3 border-t border-slate-700"></td><td class="p-3 border-t border-slate-700"></td></tr>`).join('')}</table><p><b>4.</b> Buat grafik berdasarkan data yang diperoleh. Jelaskan hubungan variabel bebas dan suhu sensor.</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="5"></textarea><p><b>5.</b> Jelaskan perbedaan mekanisme perpindahan energi pada konduksi, konveksi, dan radiasi berdasarkan bukti dari simulasi.</p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="5"></textarea><p><b>6. Kesimpulan</b></p><textarea class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3" rows="4"></textarea></div></div>`;$('m3-eval').innerHTML=quiz(3,[['Perpindahan kalor melalui zat padat tanpa perpindahan massa disebut ...','konduksi'],['Perpindahan kalor yang disertai aliran fluida disebut ...','konveksi'],['Perpindahan energi yang tidak memerlukan medium disebut ...','radiasi'],['Panas Matahari sampai ke Bumi terutama melalui ...','radiasi']]);
function quiz(n,qs){return `<div class="card rounded-3xl p-6"><span class="text-xs font-bold text-emerald-300">EVALUASI PERTEMUAN ${n}</span><h2 class="text-2xl font-black mt-1 mb-6">Cek Pemahaman</h2><div class="space-y-5">${qs.map((q,i)=>`<div><p class="text-sm font-semibold">${i+1}. ${q[0]}</p><input data-answer="${esc(q[1])}" class="quizinput w-full mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm" placeholder="Tulis jawaban..."></div>`).join('')}</div><button onclick="checkQuiz(this)" class="mt-6 btn bg-emerald-600">Periksa Jawaban</button><div class="quizresult mt-4 text-sm"></div></div>`};function checkQuiz(btn){let box=btn.parentElement,inputs=box.querySelectorAll('.quizinput'),score=0;inputs.forEach(i=>{let a=i.value.toLowerCase().replace(/[^a-z0-9=+Δ_ .]/g,'').trim(),key=i.dataset.answer.toLowerCase();if(a&&key.split(' ').filter(w=>w.length>3).some(w=>a.includes(w)))score++});box.querySelector('.quizresult').innerHTML=`<b>Hasil: ${score}/${inputs.length}</b><br><span class="text-slate-400">Gunakan hasil sebagai umpan balik dan periksa kembali konsep.</span>`}
$('btnHome').onclick=goHome;$('btnMeeting1').onclick=()=>openMeeting(1);$('btnMeeting2').onclick=()=>openMeeting(2);$('btnMeeting3').onclick=()=>openMeeting(3);m1('materi');m2('materi');m3('materi');renderMath();
</script>
